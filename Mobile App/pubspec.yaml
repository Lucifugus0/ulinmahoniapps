name: ulinmahoniapps
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.11+1

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  camera: ^0.12.0
  connectivity_plus: ^7.0.0
  cookie_jar: ^4.0.8
  country_icons: ^3.0.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  dio_cookie_manager: ^3.2.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_localization: ^0.3.3
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.1.0
  font_awesome_flutter: ^11.0.0
  go_router: ^17.1.0
  google_fonts: ^8.0.0
  google_sign_in: ^7.2.0
  grouped_list: ^6.0.0
  http: ^1.4.0
  image: ^4.5.4
  gal: ^2.3.0
  geolocator: ^14.0.0
  image_picker: ^1.2.0
  cached_network_image: ^3.3.0
  internet_connection_checker_plus: ^2.9.1
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  link_text: ^0.2.1
  local_auth: ^3.0.0
  lottie: ^3.3.1
  mime: ^2.0.0
  permission_handler: ^12.0.0+1
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  skeletonizer: ^2.1.0+1
  smooth_page_indicator: ^2.0.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  video_player: ^2.10.0
  video_player_android: ^2.8.9
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  firebase_analytics: ^12.2.0
  device_info_plus: ^12.3.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ulinmahonilogo.png"

flutter_native_splash:
  color: "#FFFFFF"
  background_image: "assets/images/ulinmahonilogo.png"
  android_12:
    color: "#FFFFFF"
    background_image: "assets/images/ulinmahonilogo.png"
  android: true
  android_gravity: fill
  ios_content_mode: scaleAspectFit

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/videos/myvideo.mp4
    - assets/images/ulinhouse.jpg
    - assets/images/ulinmahonilogo.png
    - assets/images/house.png
    - assets/fonts/

  fonts:
    - family: Inter # Nama keluarga font yang akan Anda gunakan di kode Flutter
      fonts:
        # Regular dan Italic
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          style: italic

        # Thin (100) dan ThinItalic
        - asset: assets/fonts/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic

        # ExtraLight (200) dan ExtraLightItalic
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic

        # Light (300) dan LightItalic
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic

        # Medium (500) dan MediumItalic
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic

        # SemiBold (600) dan SemiBoldItalic
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic

        # Bold (700) dan BoldItalic
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic

        # ExtraBold (800) dan ExtraBoldItalic
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic

        # Black (900) dan BlackItalic
        - asset: assets/fonts/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic
  # The following line ensures that the Material Icons fonts is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the fonts family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the fonts. For
